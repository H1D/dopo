name: CI

on:
  pull_request:
  push:
    branches: [master]

# Least privilege: every job (deploy included) only reads the repo; Cloudflare
# auth is a repository secret, never a GitHub permission.
permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Unit tests (lm shapes, rules, clean, cardHTML XSS property test)
        run: bun test

      - name: Typecheck (strict checkJs over public/ modules)
        run: bunx tsc --noEmit

      # Gates: no inline script/style/style= in HTML; CSP meta first in <head>
      # and matches the per-file expected policy (index.html: + music CDN,
      # script-src 'self' 'wasm-unsafe-eval'; offline.html: baseline);
      # esc() interpolation tripwire; external-URL allowlist (fetch: self +
      # api.lunchmoney.dev + openrouter.ai + dopo-music.artems.net; nav hrefs:
      # my.lunchmoney.app, openrouter.ai, lunchmoney.app); sw.js precache ==
      # public/ contents (vendor/ exempt one-directionally); vendor.lock sha256
      # pin over public/vendor/**; __DOPO_VERSION__ placeholder intact;
      # package.json has no dependencies.
      - name: Static tree checks
        run: bun scripts/ci-checks.ts

      - name: Assert zero runtime dependencies
        run: |
          if jq -e 'has("dependencies")' package.json > /dev/null; then
            echo '::error::package.json must not have a "dependencies" key'
            exit 1
          fi

  gitleaks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      # Pinned CLI instead of the action: fewer moving parts, one less supply-chain dep,
      # and it scans the full history deterministically regardless of event type.
      - name: Scan full history with gitleaks
        run: |
          curl -sSfL https://github.com/gitleaks/gitleaks/releases/download/v8.30.1/gitleaks_8.30.1_linux_x64.tar.gz -o gl.tgz
          echo "$(curl -sSfL https://github.com/gitleaks/gitleaks/releases/download/v8.30.1/gitleaks_8.30.1_checksums.txt | grep linux_x64.tar.gz | awk '{print $1}')  gl.tgz" | sha256sum -c -
          tar -xzf gl.tgz gitleaks
          ./gitleaks git --redact --no-banner

  build:
    runs-on: ubuntu-latest
    needs: [test]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0

      - name: Install dependencies
        run: bun install --frozen-lockfile

      # Copies public/ -> dist/ and stamps __DOPO_VERSION__ with a content hash;
      # fails hard if the placeholder is missing.
      - name: Stamp service worker version
        run: bun scripts/stamp-sw.ts

  # CD: every commit that lands on master ships to dopo.artems.net once all
  # gates pass. Secrets are unavailable to fork PRs (push-trigger only), and the
  # token is scoped to this Worker's account, not the whole Cloudflare account.
  deploy:
    if: github.event_name == 'push' && github.ref == 'refs/heads/master'
    runs-on: ubuntu-latest
    needs: [test, gitleaks, build]
    concurrency:
      group: deploy-production # serialize; never cancel a deploy mid-flight
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Stamp service worker version
        run: bun scripts/stamp-sw.ts

      - name: Deploy to dopo.artems.net
        run: bunx wrangler deploy
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}


