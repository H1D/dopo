<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <!-- rounded-square teal background -->
  <rect width="512" height="512" rx="112" fill="#2a6b64"/>
  <!-- back card, peeking behind, slightly darker -->
  <rect x="150" y="128" width="212" height="288" rx="28" fill="#1e4f4a"
        transform="rotate(-4 256 272)"/>
  <!-- front card, tilted white -->
  <g transform="rotate(8 256 272)">
    <rect x="150" y="112" width="212" height="288" rx="28" fill="#ffffff"/>
    <!-- teal checkmark on the card -->
    <path d="M198 262 l44 46 l84 -96" fill="none" stroke="#2a6b64"
          stroke-width="34" stroke-linecap="round" stroke-linejoin="round"/>
  </g>
</svg>
