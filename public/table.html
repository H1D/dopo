<!DOCTYPE html>
<html lang="en">
<head>
<meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'self'; style-src 'self'; img-src 'self'; manifest-src 'self'; connect-src 'self' https://api.lunchmoney.dev https://openrouter.ai; base-uri 'self'; form-action 'none'; object-src 'none'">
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>dopo — table view</title>
<link rel="stylesheet" href="./table.css">
<link rel="icon" href="./icon.svg" type="image/svg+xml">
</head>
<body>
<header>
  <a class="back" href="./">&larr; swipe mode</a>
  <h1>dopo · table view</h1>
  <span id="summary" class="status"></span>
  <button id="apply" class="primary" disabled>Apply selected to Lunch Money</button>
</header>
<main>
  <div id="txns" class="empty">Loading…</div>
  <section class="rules">
    <h2>Local rules</h2>
    <p class="rules-note">Applied automatically before the AI on every run (stored on this device
      only). Lunch Money's API can't create native rules — mirror the ones you want in the
      <a href="https://my.lunchmoney.app/rules" target="_blank" rel="noopener">LM rules UI</a>
      and tick them off here.</p>
    <div id="rules"></div>
  </section>
</main>
<div id="toast"></div>
<script type="module" src="./table.js"></script>
</body>
</html>
