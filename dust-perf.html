<!doctype html>
<!--
  Dev harness for the impact-dust system. Not shipped: it lives at the repo
  root, not in public/, so it stays out of the service worker precache.

  It imports the REAL public/lib/dust.js and the REAL public/app.css, so what
  you see here is production code — not a replica. Served by the dev server,
  which mounts public/ at / and this file at /dust-perf.html.
-->
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>dust perf harness</title>
<link rel="stylesheet" href="app.css">
<style>
  body { margin: 0; display: flex; flex-direction: column; height: 100vh; }
  .panel {
    display: flex; gap: 8px; flex-wrap: wrap; align-items: center;
    padding: 10px 14px; border-bottom: 1px solid var(--line);
    font: 13px system-ui, sans-serif; color: var(--muted);
  }
  .panel button {
    font: inherit; font-weight: 600; color: var(--ink); background: var(--card);
    border: 1px solid var(--line); border-radius: 8px; padding: 5px 11px; cursor: pointer;
  }
  .panel button[aria-pressed="true"] { border-color: var(--ink); color: var(--ink); }
  .readout { font-variant-numeric: tabular-nums; margin-left: auto; }
  .readout b { color: var(--ink); }
  .card .demo { padding: 20px; font: 600 15px system-ui, sans-serif; color: var(--ink); }
  .card .demo small { display: block; color: var(--muted); font-weight: 500; margin-top: 6px; }
</style>
</head>
<body>
<div class="panel">
  <button id="replay">replay (space)</button>
  <button id="swipe">swipe one card</button>
  <span>tier:</span>
  <button class="tier" data-t="2" aria-pressed="true">2 full</button>
  <button class="tier" data-t="1">1 css-only</button>
  <button class="tier" data-t="0">0 off</button>
  <span>heft:</span>
  <button class="heft" data-h="0" aria-pressed="true">0 typical</button>
  <button class="heft" data-h="0.5">.5 threshold</button>
  <button class="heft" data-h="1">1 huge</button>
  <button id="burn">simulate slow CPU: off</button>
  <button id="loop">auto-replay: off</button>
  <span class="readout" id="readout">—</span>
</div>

<!-- the app's real chrome, so the falling card's pass behind it can be checked
     here rather than only in the app -->
<header class="top">
  <span class="brand">dopo</span>
</header>
<div class="progress"><div class="progress-fill" style="width:40%"></div></div>
<div class="meter">12 left · demo harness</div>

<main class="stage" id="stage">
  <div class="stack" id="stack"></div>
</main>

<script type="module">
import { createDust, DEAL_MS, QUAKE_AT } from "./lib/dust.js";

let HEFT = 0; // forced heft, so the shake can be exercised without real data

const stage = document.getElementById("stage");
const stack = document.getElementById("stack");
const readout = document.getElementById("readout");

const dust = createDust({ reducedMotion: false, haptic: () => {} });
dust.preload();
matchMedia("(prefers-color-scheme: dark)").addEventListener("change", () => dust.onThemeChange());

const DEMO = [
  ["Albert Heijn", "Yesterday · Checking · −€42.17"],
  ["NS", "Tuesday · Checking · −€11.40"],
  ["Spotify", "Monday · Credit · −€10.99"],
];

function replay() {
  stack.innerHTML = "";
  for (let i = 2; i >= 0; i--) {
    const c = document.createElement("div");
    c.className = `card c${i} dealing deal-${i}`;
    c.innerHTML = `<div class="demo">${DEMO[i][0]}<small>${DEMO[i][1]}</small></div>`;
    c.addEventListener("animationend", () => c.classList.remove("dealing", `deal-${i}`), { once: true });
    stack.appendChild(c);
  }
  dust.blast(stack, "deal", HEFT);
  // sample once the sim has finished and stop() has scored the blast
  setTimeout(sample, DEAL_MS + 1600);
}

/* Mirrors what renderStack now does per swipe: the dispatched card flies off,
   the survivors slide forward (they were never in the air), and the one card
   that actually arrived drops in at the back and kicks up dust. */
let nextPayee = 0;
const MORE = [["Etos", "−€8.45"], ["Thuisbezorgd", "−€24.10"], ["KPN", "−€49.00"], ["Bol", "−€31.99"]];
function swipe() {
  const cards = [...stack.querySelectorAll(".card:not(.flying)")];
  const top = cards.find((c) => c.classList.contains("c0"));
  if (!top) return replay();
  // mirror flyOutTop(): the departing card is pulled above the deck explicitly,
  // because it and the promoted card both sit at .c0's z-index and would
  // otherwise fall back to DOM order
  top.classList.add("flying");
  top.style.zIndex = "10";
  top.style.transition = "transform .32s ease-in, opacity .32s ease-in";
  top.style.transform = "translateX(120%) rotate(14deg)";
  top.style.opacity = "0";
  setTimeout(() => top.remove(), 340);

  for (const c of cards) {
    if (c === top) continue;
    if (c.classList.contains("c1")) {
      // the promoted card is the one you are looking at — it does the landing
      c.classList.remove("c1"); c.classList.add("c0", "landing");
      c.addEventListener("animationend", () => c.classList.remove("landing"), { once: true });
    } else if (c.classList.contains("c2")) { c.classList.remove("c2"); c.classList.add("c1"); }
  }
  // the genuinely new card just appears at the back: animating it there is
  // wasted work, it is fully occluded by the two cards in front of it
  const [payee, amt] = MORE[nextPayee++ % MORE.length];
  const fresh = document.createElement("div");
  fresh.className = "card c2";
  fresh.innerHTML = `<div class="demo">${payee}<small>Today · Checking · ${amt}</small></div>`;
  stack.appendChild(fresh);
  dust.blast(stack, "land", HEFT);
  setTimeout(sample, DEAL_MS + 1600);
}

/* ---- instrumentation ---- */

// rAF interval sampling gives the honest end-user number: what the page
// actually achieved, including any jank we caused.
let frames = 0, worst = 0, lastT = performance.now();
(function meter(now) {
  const d = now - lastT; lastT = now;
  if (d < 500) { frames++; worst = Math.max(worst, d); }
  requestAnimationFrame(meter);
})(performance.now());

function sample() {
  const fps = frames; frames = 0;
  readout.innerHTML =
    `tier <b>${dust.tier}</b> · dust draw <b>${dust.lastAvgDrawMs.toFixed(2)}ms</b>/frame · ` +
    // note: at tier <2 the sim never runs, so these two hold the last tier-2
    // reading rather than going stale-by-accident
    `last sim interval <b>${dust.lastAvgFrameMs.toFixed(1)}ms</b> · ` +
    `worst frame <b>${worst.toFixed(1)}ms</b> · <b>${fps}</b> frames sampled`;
  worst = 0;
  document.querySelectorAll(".tier").forEach((b) =>
    b.setAttribute("aria-pressed", String(Number(b.dataset.t) === dust.tier)));
}

/* ---- controls ---- */

document.getElementById("replay").addEventListener("click", replay);
document.getElementById("swipe").addEventListener("click", swipe);
document.addEventListener("keydown", (e) => {
  if (e.code === "Space") { e.preventDefault(); replay(); }
});
document.querySelectorAll(".heft").forEach((b) => b.addEventListener("click", () => {
  HEFT = Number(b.dataset.h);
  document.querySelectorAll(".heft").forEach((o) => o.setAttribute("aria-pressed", String(o === b)));
  swipe();
}));
document.querySelectorAll(".tier").forEach((b) => b.addEventListener("click", () => {
  dust.setTier(Number(b.dataset.t));
  replay();
}));

// Occupies the main thread every frame, the way a cheap phone would, to prove
// the frame-budget demotion in dust.js actually fires.
let burning = false, burnRAF = 0;
document.getElementById("burn").addEventListener("click", (e) => {
  burning = !burning;
  e.target.textContent = `simulate slow CPU: ${burning ? "on" : "off"}`;
  e.target.setAttribute("aria-pressed", String(burning));
  if (burning) {
    const spin = () => {
      // 45ms of hogging per frame drives the achieved interval past dust.js's
      // 30ms JANK_MS threshold — a 22ms spin only reached ~23ms and correctly
      // did not demote, which made the demotion path untestable.
      const until = performance.now() + 45;
      while (performance.now() < until) { /* hog */ }
      if (burning) burnRAF = requestAnimationFrame(spin);
    };
    burnRAF = requestAnimationFrame(spin);
  } else if (burnRAF) cancelAnimationFrame(burnRAF);
});

let looping = 0;
document.getElementById("loop").addEventListener("click", (e) => {
  if (looping) { clearInterval(looping); looping = 0; e.target.textContent = "auto-replay: off"; e.target.setAttribute("aria-pressed", "false"); return; }
  looping = setInterval(replay, 2600);
  e.target.textContent = "auto-replay: on";
  e.target.setAttribute("aria-pressed", "true");
});

replay();
</script>
</body>
</html>
